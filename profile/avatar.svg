<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512" role="img" aria-label="Syntaktik">
  <!--
    Organisation avatar. Full-bleed navy: GitHub crops avatars to a circle in
    some views and a rounded square in others, so the background must reach the
    edges and the mark must stay inside the inscribed circle. The mark is the
    favicon geometry scaled to 0.85 about the centre for exactly that clearance.
    White + blue-300 on navy is the spec's approved on-dark combination.
  -->
  <rect width="64" height="64" fill="#111d33"/>
  <g transform="translate(32 32) scale(0.85) translate(-32 -32)">
    <g transform="translate(9.35 3.7) scale(0.7075)" fill="none" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 54.5 21.5 L 32 6 L 6 24 L 6 36 L 32 54" stroke="#ffffff"/>
      <path d="M 32 26 L 58 44 L 58 56 L 32 74 L 9.5 58.5" stroke="#7cc6f2"/>
    </g>
  </g>
</svg>
