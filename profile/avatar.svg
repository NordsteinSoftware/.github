<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Nordstein Software GmbH">
  <!--
    Organisation avatar. The needle reversed on a full-bleed ink-800 ground.
    GitHub crops avatars to a circle in some views and a rounded square in
    others, so the background reaches the edges and the needle stays inside the
    inscribed circle: the app icon geometry from the corporate identity
    (assets/favicon/nordstein-appicon.svg) with the 22 % corner radius dropped,
    because GitHub supplies its own mask. It uses the medium drawing
    (assets/logo/source/needle/mark-medium-reversed.svg), not the hatched full
    one, because GitHub shows avatars at 20 to 48 px in most views.

    Do not edit the shapes. They come from the corporate identity; the source
    of truth is NordsteinSoftware/CorporateIdentity.
  -->
  <rect width="512" height="512" fill="#1F2124"/>
  <g transform="translate(256 256) scale(0.56) translate(-512 -512)"><polygon points="512,148 301.3,688 512,876 512,800 369.5,676 512,606" fill="#EBE9E4"/><line x1="333.4" y1="690" x2="506" y2="844.0" stroke="#E0A92E" stroke-width="9" stroke-linecap="butt"/><polygon points="512,148 722.7,688 654.5,676 512,606" fill="#8B8F94"/><polygon points="722.7,688 512,876 512,800 654.5,676" fill="#EBE9E4"/></g>
</svg>
